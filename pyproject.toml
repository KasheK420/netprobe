[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netprobe"
version = "1.0.0"
description = "Network quality monitor — measure packet loss, jitter & latency during gaming sessions. Generate professional PDF reports for ISP complaints."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Lukas Majoros", email = "majoros.lukas@pm.me" }]
keywords = ["network", "ping", "packet-loss", "jitter", "latency", "gaming", "cs2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.0",
    "icmplib>=3.0",
    "matplotlib>=3.7",
    "fpdf2>=2.7",
    "rich>=13.0",
    "flask>=3.0",
    "flask-socketio>=5.3",
]

[project.scripts]
netprobe = "netprobe.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/netprobe"]
